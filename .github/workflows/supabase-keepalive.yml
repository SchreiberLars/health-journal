name: Supabase Keepalive

# Verhindert die automatische Pausierung des Supabase-Free-Projekts
# nach 7 Tagen Inaktivitaet. Zweimal pro Woche eine Mini-Abfrage.
on:
  schedule:
    - cron: '17 6 * * 1,4'   # Mo + Do, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://qfzzzxlxyvaokmrkbdrp.supabase.co/rest/v1/get_sorten?select=id&limit=1" \
            -H "apikey: sb_publishable_nGpFcOPg5OKxFK140HMjoQ_mXHGw_R9")
          echo "HTTP $code"
          test "$code" = "200"
